allowBuilds:
  '@prisma/engines': true
  core-js: true
  prisma: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - core-js
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
# Security overrides (18 Nov 2026): force patched versions of transitive dependencies.
overrides:
  dompurify: '>=3.4.18'
  '@auth/core': '>=0.41.3'
  postcss: '>=8.5.33'
  fast-uri: '>=3.1.9'
  browserslist: '>=4.28.7'
  source-map-js: '>=1.2.2'
  baseline-browser-mapping: '>=2.11.0'
