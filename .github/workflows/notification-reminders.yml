name: Notification Reminders

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  run-notification-reminders:
    name: Run notification reminder job
    runs-on: ubuntu-latest
    steps:
      - name: Trigger internal notification job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is required."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required."
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/internal/jobs/notifications"
