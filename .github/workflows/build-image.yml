name: Build image

# Every push to main builds ghcr.io/bond50/cosec-comm-system:<commit sha>.
# Deploying to siscom is a separate step: infra-siscom-v1 workflow "14k - Deploy COSEC"
# with that tag. The build never receives the real DATABASE_URL (the Dockerfile uses a
# placeholder); all secrets are runtime-only on the server.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-cosec
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml
    secrets: inherit   # the SonarQube scan needs SONAR_TOKEN; without this it is skipped

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Refuse data, dumps, keys and env files in the repo
        run: |
          bad=$(git ls-files | grep -iE '\.(csv|xlsx?|sql\.gz|dump|pem|key|p12|pfx)$|(^|/)\.env($|\.)' | grep -vE '^prisma/migrations/.*\.sql$|\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::These files must never be in the repo:"; echo "$bad"; exit 1; fi

      - name: Site key present
        env:
          SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: '[ -n "$SITE_KEY" ] || { echo "::error::secret NEXT_PUBLIC_TURNSTILE_SITE_KEY is not set"; exit 1; }'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/bond50/cosec-comm-system:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan_image:
    name: Image scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/bond50/cosec-comm-system:${{ github.sha }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Blocks on CRITICAL vulnerabilities that already have a fix (nothing anyone can do about the rest).
      - name: Scan the built image - CRITICAL with a fix blocks
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: table

      - name: Scan the built image - HIGH (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"
          format: table
          output: trivy-high.txt

      - name: Summary (only a scanned image may be deployed)
        if: always()
        shell: bash
        run: |
          {
            echo "Image: ${IMAGE}"
            echo
            echo "Deploy (only if this job is green): infra-siscom-v1 -> Actions -> 14k - Deploy COSEC (image_tag = ${GITHUB_SHA})"
            echo
            echo '### Image scan - HIGH vulnerabilities with a fix (report only)'
            echo '```'
            cat trivy-high.txt 2>/dev/null || echo 'No report produced.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
