name: 14h - Build & Push COSEC (GHCR) + Dispatch Deploy
run-name: "14h Build+Push COSEC (tag=${{ github.sha }}, source_sha=${{ inputs.source_sha || github.sha }})"

on:
  push:
    branches: [ main ]
    paths:
      - "**"
      - "!**/*.md"
      - "!.github/**"
  workflow_dispatch:
    inputs:
      run_infra:
        description: "Also run infra.yml on vihigago-vps"
        required: true
        default: "false"
      seed_database:
        description: "Seed the build database before docker build"
        required: true
        default: "false"
      source_sha:
        description: "Source repo full SHA (for tracking)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: cosec-ghcr
  cancel-in-progress: true

jobs:
  build_push_dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image + tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository_owner }}/cosec-comm-system"
          SHA="${GITHUB_SHA}"
          TAG="${SHA:0:7}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RUN_INFRA="${{ inputs.run_infra }}"
            SEED_DATABASE="${{ inputs.seed_database }}"
            SOURCE_SHA="${{ inputs.source_sha }}"
          else
            RUN_INFRA="false"
            SEED_DATABASE="false"
            SOURCE_SHA=""
          fi

          if [[ -z "${SOURCE_SHA:-}" ]]; then
            SOURCE_SHA="${GITHUB_SHA}"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "run_infra=${RUN_INFRA}" >> "$GITHUB_OUTPUT"
          echo "seed_database=${SEED_DATABASE}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          {
            echo "### COSEC build inputs"
            echo ""
            echo "- image: \`${IMAGE}\`"
            echo "- tag: \`${TAG}\`"
            echo "- run_infra: \`${RUN_INFRA}\`"
            echo "- seed_database: \`${SEED_DATABASE}\`"
            echo "- source_sha: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required secrets (fail fast)
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          require() {
            local name="$1"
            local value="$2"
            local hint="$3"
            if [[ -z "${value}" ]]; then
              echo "::error::Missing secret: ${name}. ${hint}"
              missing=1
            else
              echo "✅ ${name} present"
            fi
          }

          require "DB_PORT" "${{ secrets.DB_PORT }}" "Postgres port, for example 5432."
          require "DB_USER" "${{ secrets.DB_USER }}" "Postgres username for next build."
          require "DB_NAME" "${{ secrets.DB_NAME }}" "Postgres database name for next build."
          require "DB_PASSWORD" "${{ secrets.DB_PASSWORD }}" "Postgres password for next build."
          require "POSTGRES_PASSWORD" "${{ secrets.POSTGRES_PASSWORD }}" "Shared Postgres superuser password used to bootstrap the build database remotely."
          require "VPS_HOST" "${{ secrets.VPS_HOST }}" "VPS host used to open the SSH tunnel for build-time Postgres access."
          require "VPS_SSH_USER" "${{ secrets.VPS_SSH_USER }}" "SSH user for the build-time Postgres tunnel."
          require "VPS_SSH_PORT" "${{ secrets.VPS_SSH_PORT }}" "SSH port for the build-time Postgres tunnel."
          require "B64_VPS_SSH_PRIVATE_KEY" "${{ secrets.B64_VPS_SSH_PRIVATE_KEY }}" "Base64-encoded private key for the build-time Postgres tunnel."
          require "NEXT_PUBLIC_TURNSTILE_SITE_KEY" "${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" "Cloudflare Turnstile site key, inlined into the client bundle at build time."
          require "GH_APP_ID" "${{ secrets.GH_APP_ID }}" "GitHub App ID used to dispatch the deploy workflow."
          require "GH_APP_PRIVATE_KEY" "${{ secrets.GH_APP_PRIVATE_KEY }}" "GitHub App private key used to dispatch the deploy workflow."

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Decode build tunnel private key
        shell: bash
        env:
          B64_VPS_SSH_PRIVATE_KEY: ${{ secrets.B64_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${B64_VPS_SSH_PRIVATE_KEY}" | base64 -d > ~/.ssh/cosec_actions
          chmod 600 ~/.ssh/cosec_actions

      - name: Known hosts (build tunnel)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Open SSH tunnel to VPS Postgres
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          REMOTE_DB_PORT: ${{ secrets.DB_PORT }}
          LOCAL_DB_PORT: "55432"
        run: |
          set -euo pipefail
          ssh -f -N \
            -i ~/.ssh/cosec_actions \
            -p "${VPS_SSH_PORT}" \
            -L "${LOCAL_DB_PORT}:127.0.0.1:${REMOTE_DB_PORT}" \
            "${VPS_SSH_USER}@${VPS_HOST}"

          for _ in {1..10}; do
            if (echo > /dev/tcp/127.0.0.1/${LOCAL_DB_PORT}) >/dev/null 2>&1; then
              echo "✅ SSH tunnel ready on 127.0.0.1:${LOCAL_DB_PORT}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::SSH tunnel to Postgres did not open."
          exit 1

      - name: Bootstrap build database on VPS (idempotent)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          remote_env=$(
            printf 'export DB_USER=%q DB_NAME=%q DB_PASSWORD=%q POSTGRES_PASSWORD=%q\n' \
              "$DB_USER" "$DB_NAME" "$DB_PASSWORD" "$POSTGRES_PASSWORD"
          )

          ssh -i ~/.ssh/cosec_actions -p "${VPS_SSH_PORT}" "${VPS_SSH_USER}@${VPS_HOST}" 'bash -se' <<SSH
          ${remote_env}
          set -euo pipefail

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" proxy-postgres-1 \
            psql -U postgres -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='$DB_NAME';" | grep -q 1 || \
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" proxy-postgres-1 \
            createdb -U postgres "$DB_NAME"

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" proxy-postgres-1 \
            psql -U postgres -d postgres -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='$DB_USER';" | grep -q 1 || \
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" proxy-postgres-1 \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$DB_USER\" LOGIN PASSWORD '$DB_PASSWORD';"

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" proxy-postgres-1 \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE \"$DB_USER\" WITH PASSWORD '$DB_PASSWORD';"

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" proxy-postgres-1 \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "GRANT ALL PRIVILEGES ON DATABASE \"$DB_NAME\" TO \"$DB_USER\";"

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" proxy-postgres-1 \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE \"$DB_NAME\" OWNER TO \"$DB_USER\";"
          SSH

      - name: Build DATABASE_URL from DB secrets
        id: database_url
        shell: bash
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "55432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from urllib.parse import quote

          host = os.environ["DB_HOST"]
          port = os.environ["DB_PORT"]
          user = quote(os.environ["DB_USER"], safe="")
          password = quote(os.environ["DB_PASSWORD"], safe="")
          name = quote(os.environ["DB_NAME"], safe="")

          print(f"database_url=postgresql://{user}:{password}@{host}:{port}/{name}")
          PY

      - name: Set up PNPM for Prisma bootstrap
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node for Prisma bootstrap
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PNPM dependencies for Prisma bootstrap
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Prisma migrations for build database
        shell: bash
        env:
          DATABASE_URL: ${{ steps.database_url.outputs.database_url }}
        run: |
          set -euo pipefail
          corepack enable
          pnpm prisma migrate deploy

      - name: Seed build database baseline content
        if: ${{ steps.vars.outputs.seed_database == 'true' }}
        shell: bash
        env:
          DATABASE_URL: ${{ steps.database_url.outputs.database_url }}
        run: |
          set -euo pipefail
          corepack enable
          pnpm run db:seed:county

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (plain logs)
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          allow: network.host
          network: host
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
            DATABASE_URL=${{ steps.database_url.outputs.database_url }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify tag exists in GHCR
        shell: bash
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null
          echo "✅ Found ${IMAGE}:${TAG}"

      - name: Create GitHub App token for vihigago-vps
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: bond50
          repositories: vihigago-vps

      - name: Dispatch deploy workflow on vihigago-vps
        shell: bash
        env:
          TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER: bond50
          REPO: vihigago-vps
          WORKFLOW_FILE: 14h-deploy-cosec-dispatch.yml
          REF: main
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          RUN_INFRA: ${{ steps.vars.outputs.run_infra }}
          SOURCE_SHA: ${{ steps.vars.outputs.source_sha }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y jq >/dev/null
          fi

          API="https://api.github.com/repos/${OWNER}/${REPO}"

          echo "==> Verifying workflow exists: ${OWNER}/${REPO}/.github/workflows/${WORKFLOW_FILE}"
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${API}/actions/workflows/${WORKFLOW_FILE}" >/dev/null

          dispatched_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "==> Dispatching ${WORKFLOW_FILE} ref=${REF}"
          echo "    inputs: image_tag=${IMAGE_TAG} run_infra=${RUN_INFRA} source_sha=${SOURCE_SHA}"

          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${API}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d "$(jq -n \
              --arg ref "${REF}" \
              --arg run_infra "${RUN_INFRA}" \
              --arg source_sha "${SOURCE_SHA}" \
              --arg image_tag "${IMAGE_TAG}" \
              '{ref:$ref, inputs:{run_infra:$run_infra, source_sha:$source_sha, image_tag:$image_tag}}'
            )"

          echo "✅ Dispatched at ${dispatched_at}"

          {
            echo "### COSEC deploy dispatched"
            echo ""
            echo "- repo: \`${OWNER}/${REPO}\`"
            echo "- workflow: \`${WORKFLOW_FILE}\`"
            echo "- ref: \`${REF}\`"
            echo "- image_tag: \`${IMAGE_TAG}\`"
            echo "- source_sha: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
